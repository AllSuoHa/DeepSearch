[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch-cli"
version = "2.1.0"
description = "Iterative AI deep-search agent with traceable citations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DeepSearch contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "streamlit>=1.62,<2"]
ui = ["streamlit>=1.62,<2"]

[project.scripts]
deepsearch = "deepsearch.presentation.cli:main"

[tool.setuptools.packages.find]
include = ["deepsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
